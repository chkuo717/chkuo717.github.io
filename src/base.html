<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <script src="{{root}}assets/anim/draw.js" defer></script>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,700;1,400&display=swap">
  <link rel="stylesheet" href="{{root}}assets/style.css">
</head>
<body class="{{body_class}}">
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{root}}index.html">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="7" cy="25" r="2.4"/><circle cx="25" cy="25" r="2.4"/><circle cx="11" cy="11" r="2.4"/><circle cx="23" cy="8" r="2.4"/><path d="M7 25 L11 11 L23 8 L25 25"/></svg>
        <span>Chin-Hsing Kuo</span>
      </a>
      <button class="menu-toggle" aria-expanded="false" aria-controls="nav" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <nav id="nav" class="site-nav">
        {{nav}}
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
{{content}}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© Chin-Hsing Kuo · University of Wollongong, Australia</p>
      <p class="muted">Figures and animations on this site are drawn by the author or taken from the author's own published papers, credited where shown.</p>
    </div>
  </footer>
  <script src="{{root}}assets/site.js" defer></script>
</body>
</html>
